<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>This is a dice</h1>
    <p>Click the button to roll the dice</p>
    <input id="diceValue" type="number" min="0" max="20"></input>

    <button id="rollDice">Roll the dice</button>

    <p id="output"></p>

    <script> 
        function rollDice() {
            
            let diceInput = document.getElementById("diceValue");
            let diceValue = diceInput.value;
            let diceRandomValue = Math.random() * diceValue;

            let fullDiceNumber = Math.ceil(diceRandomValue);
            //console.log("Rolling the dice...", diceValue);

            console.log(fullDiceNumber);

            let output = document.getElementById("output");
            output.innerText = fullDiceNumber;
        }

        let button = document.getElementById("rollDice");

        button.addEventListener("click", rollDice);
    </script>
</body>
</html>
